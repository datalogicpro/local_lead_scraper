[project]
name = "local-lead-scraper"
version = "0.1.0"
description = "Collects local business leads from the Google Places API, cleans them, and saves them to a SQL database."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
